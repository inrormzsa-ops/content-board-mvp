<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Board MVP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-copy">
        <p class="eyebrow">Контент-пайплайн</p>
        <h1>Доска контента</h1>
        <p class="subtitle">
          Собирай идеи, доводи посты до публикации и не теряй, что на какой стадии.
        </p>
      </div>
      <div class="header-actions">
        <div class="storage-status" aria-label="Статус сохранения">
          <span></span>
          Сохраняется в браузере
        </div>
        <button class="primary-action" id="addPostButton" type="button">
          <span aria-hidden="true">+</span>
          Идея
        </button>
      </div>
    </header>

    <section class="summary-strip" id="summaryStrip" aria-label="Сводка по доске"></section>

    <section class="toolbar" aria-label="Поиск, фильтры и перенос данных">
      <label class="search-field">
        <span>Поиск</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Заголовок или текст"
          autocomplete="off"
        />
      </label>

      <label>
        Соцсеть
        <select id="networkFilter">
          <option value="all">Все соцсети</option>
        </select>
      </label>

      <label>
        Состояние
        <select id="dateFilter">
          <option value="all">Все состояния</option>
          <option value="withoutDate">Без даты</option>
          <option value="overdue">Просроченные</option>
          <option value="stale">Зависшие</option>
        </select>
      </label>

      <label>
        Зависла после
        <input id="staleThresholdInput" type="number" min="1" max="30" step="1" />
      </label>

      <div class="toolbar-actions">
        <button class="secondary-action" id="exportButton" type="button">Экспорт</button>
        <label class="secondary-action file-action">
          Импорт
          <input id="importInput" type="file" accept="application/json,.json" />
        </label>
        <button class="ghost-action" id="resetFiltersButton" type="button">Сбросить</button>
      </div>
    </section>

    <main class="board" id="board" aria-label="Стадии постов"></main>

    <dialog class="post-dialog" id="postDialog">
      <form class="post-form" id="postForm" method="dialog">
        <div class="dialog-header">
          <h2 id="dialogTitle">Новая идея</h2>
          <button class="icon-button" id="closeDialogButton" type="button" aria-label="Закрыть">×</button>
        </div>

        <label>
          Заголовок
          <input id="postTitle" name="title" type="text" maxlength="80" required />
        </label>

        <label>
          Текст поста
          <textarea id="postText" name="text" rows="7" maxlength="1200" required></textarea>
        </label>

        <div class="form-grid">
          <label>
            Дата публикации
            <input id="postDate" name="date" type="date" />
          </label>

          <label>
            Соцсеть
            <select id="postNetwork" name="network">
              <option value="Instagram">Instagram</option>
              <option value="Telegram">Telegram</option>
              <option value="VK">VK</option>
              <option value="YouTube">YouTube</option>
              <option value="Другое">Другое</option>
            </select>
          </label>
        </div>

        <div class="form-actions">
          <button class="danger-action" id="deletePostButton" type="button">Удалить</button>
          <button class="primary-action" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
