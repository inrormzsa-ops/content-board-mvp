<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Board MVP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-copy">
        <p class="eyebrow">Контент-пайплайн</p>
        <h1>Доска контента</h1>
        <p class="subtitle">
          Собирай идеи, доводи посты до публикации и не теряй, что на какой стадии.
        </p>
      </div>
      <div class="header-actions">
        <div class="storage-status" aria-label="Статус сохранения">
          <span></span>
          Сохраняется в браузере
        </div>
        <button class="primary-action" id="addPostButton" type="button">
          <span aria-hidden="true">+</span>
          Идея
        </button>
      </div>
    </header>

    <section class="summary-strip" id="summaryStrip" aria-label="Сводка по доске"></section>

    <section class="reminder-panel" aria-label="Напоминания">
      <div class="reminder-copy">
        <p class="eyebrow">Напоминания</p>
        <h2>Что требует движения</h2>
      </div>
      <div class="reminder-list" id="reminderList"></div>
      <div class="reminder-actions">
        <button class="secondary-action compact-action" id="copyRemindersButton" type="button">
          Копировать
        </button>
        <a class="secondary-action compact-action" id="emailRemindersLink" href="#">Email</a>
        <a class="secondary-action compact-action" id="telegramRemindersLink" href="#" target="_blank" rel="noreferrer">
          Telegram
        </a>
      </div>
    </section>

    <section class="schedule-panel" aria-label="План публикаций">
      <div class="schedule-copy">
        <p class="eyebrow">Календарь</p>
        <h2>Ближайшие даты</h2>
      </div>
      <div class="schedule-list" id="scheduleList"></div>
    </section>

    <section class="toolbar" aria-label="Поиск, фильтры и перенос данных">
      <label class="search-field">
        <span>Поиск</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Заголовок или текст"
          autocomplete="off"
        />
      </label>

      <label>
        Соцсеть
        <select id="networkFilter">
          <option value="all">Все соцсети</option>
        </select>
      </label>

      <label>
        Состояние
        <select id="dateFilter">
          <option value="all">Все состояния</option>
          <option value="withoutDate">Без даты</option>
          <option value="overdue">Просроченные</option>
          <option value="stale">Зависшие</option>
        </select>
      </label>

      <label>
        Архив
        <select id="archiveFilter">
          <option value="active">Активные</option>
          <option value="archived">Архив</option>
          <option value="all">Все</option>
        </select>
      </label>

      <label>
        Зависла после
        <input id="staleThresholdInput" type="number" min="1" max="30" step="1" />
      </label>

      <div class="toolbar-actions">
        <button class="secondary-action" id="copyVisibleButton" type="button">Копировать список</button>
        <button class="secondary-action" id="exportButton" type="button">Экспорт</button>
        <label class="secondary-action file-action">
          Импорт
          <input id="importInput" type="file" accept="application/json,.json" />
        </label>
        <button class="ghost-action" id="resetFiltersButton" type="button">Сбросить</button>
      </div>
    </section>

    <main class="board" id="board" aria-label="Стадии постов"></main>

    <dialog class="post-dialog" id="postDialog">
      <form class="post-form" id="postForm" method="dialog">
        <div class="dialog-header">
          <h2 id="dialogTitle">Новая идея</h2>
          <button class="icon-button" id="closeDialogButton" type="button" aria-label="Закрыть">×</button>
        </div>

        <label>
          Заголовок
          <input id="postTitle" name="title" type="text" maxlength="80" required />
        </label>

        <label>
          Текст поста
          <textarea id="postText" name="text" rows="7" maxlength="1200" required></textarea>
        </label>

        <div class="template-row">
          <label>
            Шаблон
            <select id="postTemplate">
              <option value="">Выбери шаблон</option>
              <option value="lesson">Обучающий пост</option>
              <option value="case">Кейс</option>
              <option value="announcement">Анонс</option>
              <option value="question">Вопрос аудитории</option>
            </select>
          </label>
          <button class="secondary-action compact-action" id="applyTemplateButton" type="button">
            Применить
          </button>
        </div>

        <div class="form-grid">
          <label>
            Дата публикации
            <input id="postDate" name="date" type="date" />
          </label>

          <label>
            Соцсеть
            <select id="postNetwork" name="network">
              <option value="Instagram">Instagram</option>
              <option value="Telegram">Telegram</option>
              <option value="VK">VK</option>
              <option value="YouTube">YouTube</option>
              <option value="Другое">Другое</option>
            </select>
          </label>
        </div>

        <fieldset class="checklist-fieldset">
          <legend>Готовность</legend>
          <label class="checkbox-row">
            <input id="checkText" type="checkbox" />
            Текст готов
          </label>
          <label class="checkbox-row">
            <input id="checkDate" type="checkbox" />
            Дата выбрана
          </label>
          <label class="checkbox-row">
            <input id="checkReview" type="checkbox" />
            Проверено
          </label>
          <label class="checkbox-row">
            <input id="checkPublished" type="checkbox" />
            Опубликовано вручную
          </label>
        </fieldset>

        <section class="ai-panel" aria-label="AI-помощник">
          <div class="ai-panel-header">
            <h3>AI-помощник</h3>
            <div>
              <button class="secondary-action compact-action" id="aiDraftButton" type="button">Черновик</button>
              <button class="secondary-action compact-action" id="aiPromptButton" type="button">Промпт</button>
            </div>
          </div>
          <textarea id="aiOutput" rows="6" readonly placeholder="Здесь появится черновик или промпт"></textarea>
          <div class="ai-actions">
            <button class="ghost-action compact-action" id="copyAiOutputButton" type="button">Копировать</button>
            <button class="secondary-action compact-action" id="insertAiOutputButton" type="button">Вставить в текст</button>
          </div>
        </section>

        <div class="form-actions">
          <div class="form-secondary-actions">
            <button class="danger-action" id="deletePostButton" type="button">Удалить</button>
            <button class="secondary-action is-hidden" id="archivePostButton" type="button">В архив</button>
          </div>
          <button class="primary-action" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
